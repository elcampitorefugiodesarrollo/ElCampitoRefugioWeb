  mongodb:
    container_name: mongo
    image: registry-1.docker.io/library/mongo:7.0.14
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_DATABASE: *db_name
      MONGO_INITDB_ROOT_USERNAME: *db_user
      MONGO_INITDB_ROOT_PASSWORD: *db_password
    volumes:
      - mongodb-data:/data/db
    networks:
      - perritos
  mongodb-express:
    image: registry-1.docker.io/library/mongo-express:1.0.2
    restart: always
    ports:
      - 8081:8081
    #command:
    #  - bash
    #  - -c
    #  - "export ME_CONFIG_MONGODB_URL=mongodb://$ME_CONFIG_MONGODB_ADMINUSERNAME:$ME_CONFIG_MONGODB_ADMINPASSWORD@mongodb:27017/;\
    #     /sbin/tini -- /docker-entrypoint.sh
    #    "
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: *db_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: *db_password
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: false
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
    depends_on:
      - mongodb
    networks:
      - perritos
  frontend:
    build:
      context: ./client/
    ports:
      - 80:80
    networks:
      - perritos
  backend:
    build:
      context: ./api/
    #command: 
    #  - sleep
    #  - "300"
    environment:
      BACK: 3000
      ACCESS_TOKEN: alguntoken
      DB_HOSTNAME: mongodb
      USER_DB: *db_user
      PASS_DB: *db_password
      NAME_DB: *db_name
      PAYPAL_API_CLIENT: uncliente
      PAYPAL_API_SECRET: unsecretoquenodeberiaestaraca
      PAYPAL_API: una_api
      PAYPAL_BRAND: no_se_que_es_esto
      TOKEN_SECRET: untoken
      GMAIL_USER: unuser
      GMAIL_PASSWORD: unapassword
    ports:
      - 3000:3000
    depends_on:
      - mongodb
    networks:
      - perritos

